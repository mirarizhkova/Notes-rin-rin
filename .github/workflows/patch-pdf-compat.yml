name: patch pdf compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js to lazy-load legacy PDF.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old_import = "import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs';\n"
          worker_line = "pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs';\n\n"
          loading_line = "    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(currentPdfBytes.slice(0)) });"
          if old_import in s:
              s = s.replace(old_import, "import { loadPdfJs } from './pdf-compat.js';\n", 1)
          if worker_line in s:
              s = s.replace(worker_line, '', 1)
          if loading_line in s:
              s = s.replace(loading_line, "    const pdfjsLib = await loadPdfJs();\n    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(currentPdfBytes.slice(0)) });", 1)
          if "from './pdf-compat.js'" not in s or "await loadPdfJs()" not in s:
              raise SystemExit('compatibility patch was not applied')
          p.write_text(s)
          PY
      - name: Verify syntax and tests
        run: |
          node --check app.js
          node --test tests/*.mjs
      - name: Commit compatibility patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: decouple notebooks from PDF.js on older Safari"
          git push
