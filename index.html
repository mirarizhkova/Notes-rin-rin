<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f6" />
  <meta name="apple-mobile-web-app-title" content="Notes RinRin" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Notes RinRin</title>
  <link rel="apple-touch-icon" href="icon-180.png?v=3" />
  <link rel="icon" type="image/png" href="icon-192.png?v=3" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="zoom.css" />
</head>
<body>
  <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden />
  <input id="backup-input" type="file" accept="application/json,.json" hidden />

  <nav id="tabs-bar" class="tabs-bar" aria-label="Открытые документы">
    <button id="home-tab" class="home-tab active" type="button" aria-current="page" aria-label="Главная" title="Главная">⌂</button>
    <div id="document-tabs" class="document-tabs" role="tablist" aria-label="Документы"></div>
  </nav>

  <header id="home-toolbar" class="toolbar home-toolbar" aria-label="Библиотека">
    <strong class="app-name">Notes RinRin</strong>
    <label class="tool-button file-button" for="pdf-input">+ PDF</label>
    <button id="new-notebook" class="tool-button" type="button">+ Блокнот</button>
    <button id="export-library" class="tool-button" type="button">Экспорт</button>
    <label class="tool-button file-button" for="backup-input">Импорт</label>
  </header>

  <header id="document-toolbar" class="toolbar" aria-label="Инструменты" hidden>
    <button id="add-page" class="tool-button" type="button" hidden>+ Стр.</button>
    <button id="read-tool" class="tool-button active" type="button" aria-pressed="true">Рука</button>
    <button id="draw-tool" class="tool-button" type="button" aria-pressed="false">Ручка</button>
    <button id="eraser-tool" class="tool-button" type="button" aria-pressed="false">Ластик</button>

    <div class="document-info" aria-live="polite">
      <strong id="document-name">Notes RinRin</strong>
      <span id="status">Готово</span>
    </div>
  </header>

  <section id="pen-options" class="pen-options" aria-label="Настройки ручки" hidden>
    <span class="pen-options-label">Цвет</span>
    <div id="base-pen-colors" class="pen-color-row" aria-label="Базовые цвета">
      <button class="pen-color" type="button" data-color="#111111" style="--pen-color:#111111" aria-label="Чёрный"></button>
      <button class="pen-color" type="button" data-color="#2563eb" style="--pen-color:#2563eb" aria-label="Синий"></button>
      <button class="pen-color" type="button" data-color="#dc2626" style="--pen-color:#dc2626" aria-label="Красный"></button>
      <button class="pen-color" type="button" data-color="#16a34a" style="--pen-color:#16a34a" aria-label="Зелёный"></button>
      <button class="pen-color" type="button" data-color="#7c3aed" style="--pen-color:#7c3aed" aria-label="Фиолетовый"></button>
    </div>

    <label class="custom-pen-color" title="Свой цвет" aria-label="Выбрать свой цвет">
      <input id="custom-pen-color" type="color" value="#8b5cf6" />
      <span>+</span>
    </label>

    <div id="recent-pen-colors" class="pen-color-row recent-pen-colors" aria-label="Недавние цвета"></div>

    <span class="pen-options-divider" aria-hidden="true"></span>
    <span class="pen-options-label">Толщина</span>
    <div id="pen-widths" class="pen-width-row" aria-label="Толщина ручки">
      <button class="pen-width" type="button" data-width="1.4" aria-label="Тонкая"><span style="--pen-width:1.4px"></span></button>
      <button class="pen-width" type="button" data-width="2.4" aria-label="Обычная"><span style="--pen-width:2.4px"></span></button>
      <button class="pen-width" type="button" data-width="4" aria-label="Толстая"><span style="--pen-width:4px"></span></button>
      <button class="pen-width" type="button" data-width="6.5" aria-label="Очень толстая"><span style="--pen-width:6.5px"></span></button>
    </div>
  </section>

  <main id="home-view" class="home-view">
    <section class="library-heading">
      <h1>Библиотека</h1>
      <p id="library-status">Локально на этом устройстве</p>
    </section>
    <section id="library-grid" class="library-grid" aria-live="polite"></section>
    <section id="library-empty" class="empty-state library-empty">
      <h2>Пока пусто</h2>
      <p>Добавь PDF или создай пустой блокнот. Всё хранится локально в этом браузере.</p>
      <div class="empty-actions">
        <label class="open-main" for="pdf-input">Выбрать PDF</label>
        <button id="new-notebook-empty" class="open-main secondary" type="button">Новый блокнот</button>
      </div>
    </section>
  </main>

  <main id="viewer" class="viewer" aria-live="polite" hidden></main>

  <template id="page-template">
    <section class="pdf-page">
      <canvas class="pdf-canvas"></canvas>
      <canvas class="ink-canvas"></canvas>
      <div class="page-number"></div>
    </section>
  </template>

  <script type="module" src="app.js"></script>
  <script type="module" src="zoom-ui.js"></script>
</body>
</html>
